version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - durationcheck
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - staticcheck
    - unused
    - nolintlint
  settings:
    nolintlint:
      require-explanation: true
      require-specific: true

formatters:
  enable:
    - gofmt
