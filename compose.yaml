services:
  backend:
    build: ./backend
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8080
      GIN_MODE: release
      TZ: ${TZ:-UTC}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    networks:
      default:
        aliases:
          - calendar-api

  frontend:
    build: ./frontend
    environment:
      API_TARGET: ${API_TARGET:-http://backend:8080}
      TZ: ${TZ:-UTC}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
